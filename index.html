<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小鳥歌單</title>
    <style>
        /* 🎨 CSS 變數系統：支援淺色/深色主題無縫切換 */
        :root {
            --primary: #3a7bd5;
            --primary-hover: #2a66b8;
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --text-light: #94a3b8;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
            --btn-filter-bg: #f8fafc;
            --btn-filter-text: #475569;
            --note-bg: #f1f5f9;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.04);
        }

        [data-theme="dark"] {
            --primary: #4a8be5;
            --primary-hover: #3a7bd5;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-light: #cbd5e1;
            --border-color: #334155;
            --input-bg: #0f172a;
            --btn-filter-bg: #334155;
            --btn-filter-text: #cbd5e1;
            --note-bg: #334155;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.25);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-main);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        /* 頂部 Header 與固定兩側按鈕 */
        header {
            position: relative;
            text-align: center;
            margin-bottom: 25px;
            padding: 28px 20px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
            min-height: 120px;
        }

        /* 📍 Header 左中區塊（包含吉祥物圖片與社群連結） */
        .header-left {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* 🐥 小鳥吉祥物：像素清晰化 + 自行飄浮動畫 */
        .header-avatar {
            width: 72px;
            height: 72px;
            object-fit: contain;
            image-rendering: pixelated; /* 保持像素風格清晰不模糊 */
            animation: float 3s ease-in-out infinite;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .header-avatar:hover {
            animation-play-state: paused;
            transform: scale(1.15) rotate(-5deg);
        }

        /* 🎈 飄浮 keyframes 動畫 */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        /* 📍 社群圖示超連結 */
        .social-links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-icon {
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-icon.twitch:hover {
            color: #9146ff;
            transform: scale(1.18);
        }

        .social-icon.youtube:hover {
            color: #ff0000;
            transform: scale(1.18);
        }

        header h1 {
            margin: 0 0 10px 0;
            color: var(--text-main);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 📍 深色模式切換按鈕：固定在 Header 最右側垂直居中 */
        .theme-toggle-btn {
            position: absolute;
            top: 50%;
            right: 24px;
            transform: translateY(-50%);
            background: var(--btn-filter-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 🔍 搜尋、排序與許願控制區 */
        .control-panel {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* 搜尋框、排序與許願按鈕組合列 */
        .search-sort-row {
            display: flex;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-main);
            background-color: var(--input-bg);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(58,123,213,0.15);
        }

        /* ↕️ 排序下拉選單 */
        .sort-select {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            color: var(--text-main);
            background-color: var(--input-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 150px;
        }

        .sort-select:focus {
            border-color: var(--primary);
        }

        /* 💡 許願按鈕觸發器 */
        .btn-wish-trigger {
            background: #8b5cf6;
            border: 1px solid #8b5cf6;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.25);
        }

        .btn-wish-trigger:hover {
            background: #7c3aed;
            border-color: #7c3aed;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 70px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: var(--btn-filter-bg);
            border: 1px solid var(--border-color);
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--btn-filter-text);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .btn-filter:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-filter.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(58,123,213,0.3);
        }

        /* 歌曲雙欄排版 */
        .song-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .song-item {
            background: var(--bg-card);
            padding: 18px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s;
            border: 1px solid var(--border-color);
            border-left: 5px solid #cbd5e1;
            word-break: break-word;
        }

        .song-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* 第一排：語言、歌名、作者、標籤、一鍵複製 */
        .song-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lang-badges, .tag-badges {
            display: inline-flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 語言小膠囊 */
        .badge-lang {
            padding: 3px 7px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0,0,0,0.15);
            white-space: nowrap;
        }
        .badge-lang.lang-中文 { background: #00bcd4; }
        .badge-lang.lang-日文 { background: #f1c40f; color: #000000; text-shadow: none; }
        .badge-lang.lang-英文 { background: #e91e63; }
        .badge-lang.lang-韓文 { background: #ff5722; }
        .badge-lang.lang-台語 { background: #1b5e20; }
        .badge-lang.lang-其他 { background: #475569; }

        .song-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.4;
        }

        .song-author {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            line-height: 1.4;
        }

        .badge-custom-tag {
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
        }

        /* 📋 一鍵複製按鈕 */
        .btn-copy {
            margin-left: auto;
            background: var(--btn-filter-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-copy:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--bg-card);
        }

        .btn-copy.copied {
            background: #10b981 !important;
            color: #ffffff !important;
            border-color: #10b981 !important;
        }

        /* 第二排：備註欄 */
        .song-bottom-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 2px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        .badge-note {
            background: var(--note-bg);
            color: var(--text-light);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .no-result {
            grid-column: span 2;
            text-align: center;
            padding: 40px;
            background: var(--bg-card);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 15px;
            border: 1px dashed var(--border-color);
        }

        /* 💡 許願 Modal 彈出視窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .modal-card h3 {
            margin: 0 0 16px 0;
            color: var(--text-main);
            font-size: 20px;
        }

        .modal-label {
            font-size: 13px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 14px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-main);
        }

        .modal-input:focus {
            border-color: #8b5cf6;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn-cancel {
            padding: 8px 18px;
            background: var(--btn-filter-bg);
            color: var(--btn-filter-text);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-wish-submit {
            background: #8b5cf6;
            color: #ffffff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-wish-submit:hover {
            background: #7c3aed;
        }

        /* 📱 手機版 RWD 適應 */
        @media (max-width: 768px) {
            body { padding: 12px; }
            header { padding: 20px 16px; }
            .header-left { position: relative; top: 0; left: 0; transform: none; justify-content: center; margin-bottom: 12px; }
            .theme-toggle-btn { position: relative; top: 0; right: 0; transform: none; margin: 0 auto 12px auto; width: fit-content; }
            .search-sort-row { flex-direction: column; }
            .sort-select, .btn-wish-trigger { width: 100%; }
            .song-list { grid-template-columns: 1fr; }
            .no-result { grid-column: span 1; }
            .control-panel { padding: 16px; }
            .btn-copy { margin-left: 0; width: 100%; justify-content: center; margin-top: 4px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <!-- 📍 左中區塊：小鳥飄浮圖示 + 社群連結 -->
        <div class="header-left">
            <img src="export202209170956548140.png" alt="小鳥吉祥物" class="header-avatar">
            
            <div class="social-links">
                <a href="https://www.twitch.tv/girai3" target="_blank" rel="noopener noreferrer" title="Twitch 直播間" class="social-icon twitch">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M11.571 4.714h1.715v5.143h-1.715zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
                </a>
                <a href="https://www.youtube.com/@girai3" target="_blank" rel="noopener noreferrer" title="YouTube 頻道" class="social-icon youtube">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </a>
            </div>
        </div>
        
        <!-- 深色模式按鈕 (右側垂直居中) -->
        <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()">🌙 深色模式</button>

        <!-- 置中大標題 -->
        <h1>🎵 小鳥歌單</h1>
        <p>目前總共開放 <span id="totalSongs" style="font-weight:bold; color:var(--primary);">0</span> 首歌曲，歡迎點播！</p>
    </header>

    <div class="control-panel">
        <div class="search-sort-row">
            <div class="search-box">
                <input type="text" id="searchBar" class="search-input" placeholder="搜尋歌名、作者、標籤或備註..." oninput="performFilter()">
            </div>
            <select id="sortSelect" class="sort-select" onchange="performFilter()">
                <option value="default">預設排序</option>
                <option value="author">按歌手排序 (A-Z)</option>
                <option value="title">按歌名排序 (A-Z)</option>
            </select>
            <button class="btn-wish-trigger" onclick="openWishModal()">💡 許願點歌</button>
        </div>
        
        <div class="filter-group" id="langGroup">
            <div class="filter-label">語言分類</div>
            <div class="filter-buttons">
                <button class="btn-filter active" onclick="filterByLang('全部', this)">全部</button>
                <button class="btn-filter" onclick="filterByLang('中文', this)">中文</button>
                <button class="btn-filter" onclick="filterByLang('日文', this)">日文</button>
                <button class="btn-filter" onclick="filterByLang('英文', this)">英文</button>
                <button class="btn-filter" onclick="filterByLang('韓文', this)">韓文</button>
                <button class="btn-filter" onclick="filterByLang('台語', this)">台語</button>
                <button class="btn-filter" onclick="filterByLang('其他', this)">其他</button>
            </div>
        </div>

        <div class="filter-group" id="tagGroup" style="display: none;">
            <div class="filter-label">特色標籤</div>
            <div class="filter-buttons" id="tagButtonsContainer"></div>
        </div>
    </div>

    <div id="songsContainer" class="song-list"></div>
</div>

<!-- 💡 許願 Modal 視窗 -->
<div id="wishModal" class="modal-overlay">
    <div class="modal-card">
        <h3>💡 許願歌曲</h3>
        
        <label class="modal-label">歌曲名稱 *</label>
        <input type="text" id="wishTitle" class="modal-input" placeholder="例如：Lemon">
        
        <label class="modal-label">歌手 / 原唱 *</label>
        <input type="text" id="wishAuthor" class="modal-input" placeholder="例如：米津玄師">
        
        <label class="modal-label">許願原因 / 想說的話 (選填)</label>
        <textarea id="wishNote" class="modal-input" placeholder="希望能聽到你唱這首！" style="height:75px; resize:none;"></textarea>
        
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeWishModal()">取消</button>
            <button class="btn-wish-submit" onclick="submitWishToGoogleForm()">送出許願</button>
        </div>
    </div>
</div>

<script>
    // Google 表單提交資訊
    const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeb5QI_Q5epjitcohVXg7uN2g7bV1MOY7hbCvy_ZGH7f2H2dA/formResponse";
    const ENTRY_TITLE = "entry.743383619";   // 歌名
    const ENTRY_AUTHOR = "entry.453378873";  // 歌手
    const ENTRY_NOTE = "entry.1730424253";    // 備註

    let rawSongs = [];
    let currentLang = "全部";
    let currentTag = "全部";

    // 安全轉義 HTML 避免字元錯亂
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 🌙 主題切換邏輯 (LocalStorage 記憶設定)
    function initTheme() {
        const savedTheme = localStorage.getItem('bird_songlist_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeBtn(savedTheme);
    }

    function toggleTheme() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('bird_songlist_theme', newTheme);
        updateThemeBtn(newTheme);
    }

    function updateThemeBtn(theme) {
        const btn = document.getElementById('themeToggleBtn');
        if (btn) {
            btn.innerHTML = theme === 'dark' ? '☀️ 淺色模式' : '🌙 深色模式';
        }
    }

    // 📋 一鍵複製歌名邏輯
    function copySongInfo(title, author, btnElement) {
        const textToCopy = `${title} - ${author}`;
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalHTML = btnElement.innerHTML;
            btnElement.innerHTML = '✅ 已複製';
            btnElement.classList.add('copied');
            setTimeout(() => {
                btnElement.innerHTML = originalHTML;
                btnElement.classList.remove('copied');
            }, 1500);
        }).catch(err => {
            console.error('複製失敗:', err);
        });
    }

    // 💡 開啟 / 關閉 Modal
    function openWishModal() {
        document.getElementById('wishModal').style.display = 'flex';
    }

    function closeWishModal() {
        document.getElementById('wishModal').style.display = 'none';
    }

    // 💡 送出許願至 Google 表單
    async function submitWishToGoogleForm() {
        const title = document.getElementById('wishTitle').value.trim();
        const author = document.getElementById('wishAuthor').value.trim();
        const note = document.getElementById('wishNote').value.trim();

        if (!title || !author) {
            alert('請填寫歌名與歌手名稱喔！');
            return;
        }

        const formData = new FormData();
        formData.append(ENTRY_TITLE, title);
        formData.append(ENTRY_AUTHOR, author);
        formData.append(ENTRY_NOTE, note);

        try {
            await fetch(GOOGLE_FORM_ACTION_URL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            });

            alert('🎉 許願成功！歌曲已傳送到許願池囉！');
            document.getElementById('wishTitle').value = '';
            document.getElementById('wishAuthor').value = '';
            document.getElementById('wishNote').value = '';
            closeWishModal();
        } catch (err) {
            console.error('送出失敗:', err);
            alert('❌ 許願失敗，請稍後再試。');
        }
    }

    // 讀取歌曲資料
    async function fetchSongs() {
        try {
            const response = await fetch('songs.json?t=' + new Date().getTime());
            if (!response.ok) throw new Error('無法讀取 songs.json');
            rawSongs = await response.json();
            
            document.getElementById('totalSongs').innerText = rawSongs.length;
            buildTagFilterButtons();
            performFilter();
        } catch (error) {
            console.error(error);
            document.getElementById('songsContainer').innerHTML = `
                <div class="no-result">❌ 歌單載入失敗，請確認同目錄下是否有 songs.json 檔案。</div>
            `;
        }
    }

    function buildTagFilterButtons() {
        const container = document.getElementById('tagButtonsContainer');
        const tagGroupEl = document.getElementById('tagGroup');
        
        let uniqueTags = {};
        rawSongs.forEach(song => {
            if (song.tags && Array.isArray(song.tags)) {
                song.tags.forEach(t => { uniqueTags[t.name] = t.color; });
            }
        });

        const tagNames = Object.keys(uniqueTags);
        if (tagNames.length === 0) {
            tagGroupEl.style.display = "none";
            return;
        }

        tagGroupEl.style.display = "flex";
        let html = `<button class="btn-filter active" onclick="filterByTag('全部', this)">全部</button>`;
        tagNames.forEach(name => {
            html += `<button class="btn-filter" onclick="filterByTag('${escapeHtml(name)}', this)">${escapeHtml(name)}</button>`;
        });
        container.innerHTML = html;
    }

    function filterByLang(lang, btnElement) {
        currentLang = lang;
        document.querySelectorAll('#langGroup .btn-filter').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        performFilter();
    }

    function filterByTag(tagName, btnElement) {
        currentTag = tagName;
        document.querySelectorAll('#tagGroup .btn-filter').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        performFilter();
    }

    function performFilter() {
        const keyword = document.getElementById('searchBar').value.toLowerCase().trim();
        const sortType = document.getElementById('sortSelect').value;
        const container = document.getElementById('songsContainer');
        container.innerHTML = '';

        // 1. 篩選
        let filtered = rawSongs.filter(song => {
            const songLangs = song.langs || [song.lang || "中文"];
            const matchLang = (currentLang === "全部" || songLangs.includes(currentLang));

            const songTags = song.tags || [];
            const matchTag = (currentTag === "全部" || songTags.some(t => t.name === currentTag));

            const notesString = Array.isArray(song.notes) ? song.notes.join(' ') : (song.note || '');
            const matchKeyword = (!keyword ||
                (song.title && song.title.toLowerCase().includes(keyword)) ||
                (song.author && song.author.toLowerCase().includes(keyword)) ||
                notesString.toLowerCase().includes(keyword)
            );

            return matchLang && matchTag && matchKeyword;
        });

        // 2. ↕️ 排序處理
        if (sortType === 'author') {
            filtered.sort((a, b) => (a.author || '').localeCompare((b.author || ''), 'zh-Hant'));
        } else if (sortType === 'title') {
            filtered.sort((a, b) => (a.title || '').localeCompare((b.title || ''), 'zh-Hant'));
        }

        if (filtered.length === 0) {
            container.innerHTML = `<div class="no-result">🔍 沒有找到符合條件的歌曲。</div>`;
            return;
        }

        // 3. 渲染歌曲卡片
        filtered.forEach(song => {
            const songLangs = song.langs || [song.lang || "中文"];
            
            // 語言膠囊
            let langBadgesHTML = '<div class="lang-badges">';
            songLangs.forEach(l => {
                langBadgesHTML += `<span class="badge-lang lang-${escapeHtml(l)}">${escapeHtml(l)}</span>`;
            });
            langBadgesHTML += '</div>';

            // 特色標籤
            let tagsHTML = '<div class="tag-badges">';
            if (song.tags && Array.isArray(song.tags)) {
                song.tags.forEach(t => {
                    tagsHTML += `<span class="badge-custom-tag" style="background-color: ${escapeHtml(t.color)}">${escapeHtml(t.name)}</span>`;
                });
            }
            tagsHTML += '</div>';

            // 備註列
            let bottomRowHTML = '';
            const songNotes = song.notes || (song.note ? song.note.split(',').map(s => s.trim()).filter(Boolean) : []);
            if (songNotes.length > 0) {
                bottomRowHTML += '<div class="song-bottom-row">';
                songNotes.forEach(n => {
                    bottomRowHTML += `<span class="badge-note"># ${escapeHtml(n)}</span>`;
                });
                bottomRowHTML += '</div>';
            }

            // 卡片邊框顏色
            let borderColor = "#cbd5e1";
            if (songLangs[0] === "中文") borderColor = "#00bcd4";
            if (songLangs[0] === "日文") borderColor = "#f1c40f";
            if (songLangs[0] === "英文") borderColor = "#e91e63";
            if (songLangs[0] === "韓文") borderColor = "#ff5722";
            if (songLangs[0] === "台語") borderColor = "#1b5e20";
            if (songLangs[0] === "其他") borderColor = "#475569";

            const itemDiv = document.createElement('div');
            itemDiv.className = 'song-item';
            itemDiv.style.borderLeftColor = borderColor;
            
            itemDiv.innerHTML = `
                <div class="song-top-row">
                    ${langBadgesHTML}
                    <span class="song-title">${escapeHtml(song.title)}</span>
                    <span class="song-author">${escapeHtml(song.author)}</span>
                    ${tagsHTML}
                    <button class="btn-copy" onclick="copySongInfo('${escapeHtml(song.title)}', '${escapeHtml(song.author)}', this)">📋 複製</button>
                </div>
                ${bottomRowHTML}
            `;
            container.appendChild(itemDiv);
        });
    }

    // 頁面初始化
    window.onload = () => {
        initTheme();
        fetchSongs();
    };
</script>
</body>
</html>
